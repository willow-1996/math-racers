<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Race to the finish line by solving math problems! A fun arithmetic game for kids." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <title>Math Racers</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      transform-origin: top left;
      /* JS sets transform and size when portrait is detected */
    }

    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // ── Orientation / viewport management ────────────────────────────────────
    //
    // Strategy: always present a landscape viewport to Phaser regardless of how
    // the device is physically held.
    //
    // When the device is in portrait mode we:
    //  1. Rotate #game-container 90° clockwise via CSS transform.
    //  2. Give the container the swapped dimensions (visualH × visualW) so it
    //     fills the screen after rotation.
    //  3. Intercept pointer/touch events on the canvas and rotate their
    //     coordinates back 90° so Phaser receives correct landscape coords.
    //
    // Phaser uses canvas.getBoundingClientRect() + pageX/pageY for hit-testing,
    // so we patch event coordinates before they reach Phaser's input manager.

    let isPortrait = false;

    function applyOrientation() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const container = document.getElementById('game-container');

      isPortrait = vh > vw;

      if (isPortrait) {
        // Rotate 90° clockwise: the game canvas will appear landscape.
        // Container sized vh × vw (swapped landscape dims), then:
        //   translateX(vw) rotate(90deg) maps canvas corners exactly to portrait viewport.
        // Proof: canvas (cx,cy) → portrait (vw-cy, cx) which covers [0..vw] × [0..vh].
        container.style.width  = vh + 'px';   // becomes the landscape width
        container.style.height = vw + 'px';   // becomes the landscape height
        container.style.transform = `translateX(${vw}px) rotate(90deg)`;
        container.style.transformOrigin = '0 0';
      } else {
        container.style.width  = vw + 'px';
        container.style.height = vh + 'px';
        container.style.transform = '';
        container.style.transformOrigin = '0 0';
      }

      // Tell Phaser the landscape canvas dimensions directly.
      // We use Phaser.Scale.NONE so Phaser never auto-reads getBoundingClientRect()
      // (which would return the rotated/portrait size and create the wrong canvas).
      const lw = isPortrait ? vh : vw;
      const lh = isPortrait ? vw : vh;
      if (globalThis.__phaserGame) {
        globalThis.__phaserGame.scale.resize(lw, lh);
      }
    }

    // ── Input coordinate rotation ─────────────────────────────────────────────
    //
    // When portrait-rotated, Phaser sees the canvas as portrait-shaped (before
    // CSS transform). We intercept pointer events in the capture phase and
    // rewrite clientX/clientY to the equivalent landscape coordinates.
    //
    // Mapping (rotate 90° CW, i.e. the transform we applied):
    //   landscape_x =  portrait_y
    //   landscape_y = (portrait_width - portrait_x)
    // where portrait_width = window.innerWidth (the narrow side).

    function rotatePointerEvent(e) {
      if (!isPortrait) return;  // nothing to do in landscape

      const canvas = document.querySelector('#game-container canvas');
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();

      // Helper to compute rotated coords for a single {clientX, clientY} point
      function rotatePoint(clientX, clientY) {
        // Position relative to the top-left of the *physical* screen
        // In portrait mode the container is rotated 90° clockwise so:
        //   "portrait" screen dimensions are window.innerWidth (vw) × window.innerHeight (vh)
        // After the CSS rotate+translate the canvas occupies the full screen in
        // landscape orientation (vh × vw) as seen by the user.
        //
        // The canvas element itself has offsetWidth = vh, offsetHeight = vw
        // (the swapped dims we assigned), so getBoundingClientRect reports a
        // portrait-rotated box. We want to remap the raw screen touch point into
        // the landscape coordinate space Phaser expects.
        //
        // Screen (portrait): x ∈ [0, vw], y ∈ [0, vh]
        // Phaser canvas (after rotate): x ∈ [0, vh], y ∈ [0, vw]
        //
        // The rotation is: landscape_x = y_screen, landscape_y = vw - x_screen
        // (because a 90°-CW rotation maps (x,y) → (y, W-x) for width W)
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        const lx = clientY;
        const ly = vw - clientX;

        return { clientX: lx, clientY: ly };
      }

      // We cannot modify read-only properties of native events, so we
      // re-dispatch a synthetic event with corrected coordinates.  We mark it
      // with a flag so we don't re-process it.
      if (e._rotated) return;

      e.stopImmediatePropagation();
      e.preventDefault();

      const isTouchEvent = e.type.startsWith('touch');

      if (isTouchEvent) {
        const touches = [];
        const changedTouches = [];
        const targetTouches = [];

        function makeTouch(original) {
          const { clientX, clientY } = rotatePoint(original.clientX, original.clientY);
          // TouchEvent API: we create a Touch via Touch constructor where supported
          if (typeof Touch !== 'undefined' && Touch.length > 0) {
            try {
              return new Touch({
                identifier: original.identifier,
                target: original.target || canvas,
                clientX, clientY,
                pageX: clientX,
                pageY: clientY,
                screenX: clientX,
                screenY: clientY,
                radiusX: original.radiusX || 1,
                radiusY: original.radiusY || 1,
                rotationAngle: original.rotationAngle || 0,
                force: original.force || 1,
              });
            } catch (_) { /* fall through */ }
          }
          return original; // can't patch, pass through
        }

        for (const t of Array.from(e.touches || [])) touches.push(makeTouch(t));
        for (const t of Array.from(e.changedTouches || [])) changedTouches.push(makeTouch(t));
        for (const t of Array.from(e.targetTouches || [])) targetTouches.push(makeTouch(t));

        let synth;
        try {
          synth = new TouchEvent(e.type, {
            bubbles: e.bubbles,
            cancelable: e.cancelable,
            touches,
            changedTouches,
            targetTouches,
            ctrlKey: e.ctrlKey,
            shiftKey: e.shiftKey,
            altKey: e.altKey,
            metaKey: e.metaKey,
          });
        } catch (_) {
          // TouchEvent constructor not available (desktop or older browser) — skip
          return;
        }
        synth._rotated = true;
        canvas.dispatchEvent(synth);
      } else {
        // Mouse / pointer event
        const { clientX, clientY } = rotatePoint(e.clientX, e.clientY);
        const EventCtor = e instanceof PointerEvent ? PointerEvent : MouseEvent;
        const init = {
          bubbles: e.bubbles,
          cancelable: e.cancelable,
          clientX, clientY,
          pageX: clientX,
          pageY: clientY,
          screenX: clientX,
          screenY: clientY,
          button: e.button,
          buttons: e.buttons,
          pointerId: e.pointerId,
          pointerType: e.pointerType,
          width: e.width,
          height: e.height,
          pressure: e.pressure,
          isPrimary: e.isPrimary,
        };
        const synth = new EventCtor(e.type, init);
        synth._rotated = true;
        canvas.dispatchEvent(synth);
      }
    }

    // Attach capturing listeners to intercept events before Phaser sees them
    const INPUT_EVENTS = [
      'mousedown', 'mouseup', 'mousemove',
      'pointerdown', 'pointerup', 'pointermove',
      'touchstart', 'touchend', 'touchmove', 'touchcancel',
      'click',
    ];

    function attachInputInterceptors() {
      const canvas = document.querySelector('#game-container canvas');
      if (!canvas) {
        // Phaser hasn't created the canvas yet — retry shortly
        setTimeout(attachInputInterceptors, 100);
        return;
      }
      for (const type of INPUT_EVENTS) {
        canvas.addEventListener(type, rotatePointerEvent, { capture: true, passive: false });
      }
    }

    // ── Orientation lock (best-effort) ────────────────────────────────────────
    function lockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    function requestFullscreenLock() {
      const el = document.documentElement;
      const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (rfs) {
        rfs.call(el).then(() => lockLandscape()).catch(() => {});
      }
    }

    document.addEventListener('click',      requestFullscreenLock, { once: true });
    document.addEventListener('touchstart', requestFullscreenLock, { once: true });
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) lockLandscape();
    });

    lockLandscape();

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    applyOrientation();
    window.addEventListener('resize', applyOrientation);
    window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 50));

    // Wait for Phaser to create its canvas then hook input
    attachInputInterceptors();
  </script>

  <script>
    // ── Service Worker registration ───────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => {
            console.log('[SW] Registered, scope:', reg.scope);
          })
          .catch((err) => {
            console.warn('[SW] Registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
